<!DOCTYPE html>
<!--
  Title:       QR Code Redirect Handler
  Author:      Hali Sarah Parsons
  Date:        2026-09-25
  Modified By: Claude
  Description: Reads the slug from the URL path (e.g. /QRCode/Account/username-codename),
               looks up the redirect URL in Firestore, logs the scan, then
               redirects the user. Shows a brief branded loading screen while
               Firestore resolves. If slug not found, shows a helpful error.
               Deploy to: QRCode/Account/index.html
               URL format: iqproductionz.com/QRCode/Account/?slug=username-codename
               OR via GitHub Pages redirect: iqproductionz.com/QRCode/Account/[slug]
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting… | I.Q. Productionz QR</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:#0a0f1e;color:#f8fafc;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:16px;text-align:center;padding:24px;
}
.logo{font-size:1.1rem;font-weight:700;color:#60a5fa;letter-spacing:-.01em;margin-bottom:8px;}
.spin{
  width:36px;height:36px;
  border:3px solid rgba(59,130,246,.3);border-top-color:#3b82f6;
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
p{font-size:.9rem;color:#94a3b8;}
a{color:#60a5fa;}
</style>
</head>
<body>
<div class="logo">I.Q. Productionz · QR Platform</div>
<div class="spin"></div>
<p id="msg">Scanning… redirecting you now.</p>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBClNCsZwvHghZLbhr3BiP3aDys0GDvJys",
    authDomain: "qr-platform-33671.firebaseapp.com",
    projectId: "qr-platform-33671",
    storageBucket: "qr-platform-33671.firebasestorage.app",
    messagingSenderId: "564631666195",
    appId: "1:564631666195:web:515eb76f3f3f48c54c09e6"
  };

  const app  = initializeApp(firebaseConfig);
  const db   = getFirestore(app);
  const msg  = document.getElementById('msg');

  // WHY: slug can come from query param ?slug=... (easy with GitHub Pages)
  // or from the hash #slug (fallback). GitHub Pages doesn't support
  // server-side path rewrites, so we use query params on the redirect URL.
  var slug = new URLSearchParams(window.location.search).get('slug')
          || window.location.hash.replace('#','').trim();

  if (!slug) {
    msg.innerHTML = 'No QR code specified. <a href="/QRCode/">Go back</a>';
  } else {
    (async () => {
      try {
        var ref  = doc(db, 'qrcodes', slug);
        var snap = await getDoc(ref);

        if (!snap.exists()) {
          msg.innerHTML = 'QR code not found. <a href="/QRCode/">Create one</a>';
          return;
        }

        var data = snap.data();
        var dest = data.redirectUrl;

        // WHY: log scan with timestamp, device type, and basic metadata
        // so dashboard stats are accurate
        var isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        await Promise.all([
          // Increment counter on the main doc
          updateDoc(ref, { scanCount: increment(1) }),
          // Add a scan log entry for per-day / per-device breakdown
          addDoc(collection(db,'qrcodes',slug,'scans'), {
            ts: Date.now(),
            mobile: isMobile,
            ua: navigator.userAgent.slice(0,120)
          })
        ]);

        // Redirect
        window.location.replace(dest);

      } catch(e) {
        msg.innerHTML = 'Error: ' + e.message + ' · <a href="/QRCode/">Home</a>';
      }
    })();
  }
</script>
</body>
</html>
