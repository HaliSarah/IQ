<!DOCTYPE html>
<!--
  Title:       QR Code Redirect Handler
  Author:      Hali Sarah Parsons
  Date:        2026-09-25
  Modified By: Claude (2026-10-19: add https:// to bare destinations; scan logging can't block redirect; 2026-11-09: log approximate scan location;
               scanner id, os/browser/language, optional GPS + UTM tags)
  Description: Reads the slug from ?slug=... (or a #hash fallback), looks up
               the redirect URL in Firestore, logs the scan (count + device
               type, for dashboard stats), then redirects. Restyled to match
               the look of iqproductionz.com's domain-mask loader pages
               (same logo, Cinzel Decorative wordmark, pulsing glow,
               spinner, dark plum/gold overlay) so a scanned code feels like
               part of the same site instead of a plain generic redirect.
               Deploy to: QRCode/Account/index.html
               URL format: iqproductionz.com/QRCode/Account/?slug=username-codename
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting… | I.Q. Productionz QR</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative&display=swap" rel="stylesheet">
<style>
  /* WHY these exact values (bg color, overlay opacity, gold rgba, font):
     copied from the iqproductionz.com domain-mask loader Hali uploaded, so
     a scanned QR code's loading screen looks like the same site, not a
     separate generic "redirecting…" page. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#2a2720; font-family:'Inter',system-ui,sans-serif; }
  #loader {
    position:fixed; inset:0;
    background:#2a2720 url('https://static.wixstatic.com/media/b63ec4_d6fad9165f744284a4b90915a9fbbbc5~mv2.jpg/v1/fill/w_288,h_271,al_c,q_80,usm_0.66_1.00_0.01,enc_avif,quality_auto/b63ec4_d6fad9165f744284a4b90915a9fbbbc5~mv2.jpg') center/cover;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:10; transition:opacity .8s ease;
  }
  #loader::before { content:''; position:absolute; inset:0; background:rgba(20,16,10,.78); }
  #loader.hidden { opacity:0; pointer-events:none; }
  #loader img {
    position:relative; height:72px; width:auto;
    filter:drop-shadow(0 0 16px rgba(201,138,46,.7));
    margin-bottom:1.25rem;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { filter:drop-shadow(0 0 10px rgba(201,138,46,.4)); }
    50%      { filter:drop-shadow(0 0 24px rgba(201,138,46,.9)); }
  }
  #loader p {
    position:relative; font-family:'Cinzel Decorative','Palatino Linotype',serif;
    font-size:.62rem; letter-spacing:.32em; text-transform:uppercase;
    color:rgba(201,138,46,.8); text-align:center;
  }
  /* WHY a separate look for the error state: the uppercase/letter-spaced
     style reads fine for a single word like "Redirecting" but turns an
     actual error message (which needs to stay readable, with a real link
     in it) into decoration — so an error drops the caps/spacing and widens
     a bit instead. */
  #loader p.err {
    text-transform:none; letter-spacing:.02em; font-family:'Inter',system-ui,sans-serif;
    font-size:.86rem; color:#e8c9a0; max-width:260px; line-height:1.5;
  }
  #loader a { color:#c98a2e; text-decoration:underline; }
  .spinner {
    position:relative; width:24px; height:24px;
    border:2px solid rgba(201,138,46,.2); border-top-color:rgba(201,138,46,.85);
    border-radius:50%; animation:spin 1s linear infinite; margin-top:1.1rem;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="loader">
  <img src="https://iqproductionz.com/Content/Images/Main/IQ-noglow_Updated.avif" alt="I.Q. Productionz">
  <p id="msg">Redirecting</p>
  <div class="spinner" id="spinner"></div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc }
    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBClNCsZwvHghZLbhr3BiP3aDys0GDvJys",
    authDomain: "qr-platform-33671.firebaseapp.com",
    projectId: "qr-platform-33671",
    storageBucket: "qr-platform-33671.firebasestorage.app",
    messagingSenderId: "564631666195",
    appId: "1:564631666195:web:515eb76f3f3f48c54c09e6"
  };

  const app      = initializeApp(firebaseConfig);
  const db       = getFirestore(app);
  const msg      = document.getElementById('msg');
  const spinner  = document.getElementById('spinner');

  // WHY a helper instead of inlining this everywhere: every error exit
  // needs the exact same treatment — drop the all-caps "loading" styling
  // (see p.err above), hide the spinner since nothing is happening anymore,
  // and allow a real link back into the site.
  function showError(html) {
    spinner.style.display = 'none';
    msg.classList.add('err');
    msg.innerHTML = html;
  }

  // WHY normalizeDest exists: a destination saved without "https://"
  // (e.g. "IQProductionz.com/QRCode") is treated by the browser as a
  // folder on THIS site, so scans landed on
  // /QRCode/Account/IQProductionz.com/qrcode and 404'd. Adding the scheme
  // makes it a real outside address. Only http(s) is allowed so a saved
  // "javascript:" link can never run script on this domain.
  function normalizeDest(raw) {
    if (!raw) return null;
    var s = String(raw).trim();
    if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s.replace(/^\/+/, '');
    try {
      var u = new URL(s);
      return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : null;
    } catch (e) { return null; } // WHY catch: a malformed address throws; treat it as missing
  }

  // WHY: slug can come from query param ?slug=... (easy with GitHub Pages)
  // or from the hash #slug (fallback). GitHub Pages doesn't support
  // server-side path rewrites, so we use query params on the redirect URL.
  // WHY a Worker call for location: this static page can't see where the
  // visitor is, but Cloudflare's edge can (request.cf), so the QR payment
  // Worker's /geo endpoint hands back city/region/country. WHY start it
  // now, before the Firestore lookup: both run at once, so location adds
  // no wait. WHY catch to {}: a failed lookup still logs the scan, just
  // without a location.
  const GEO_URL = 'https://qrcode-order.halisarahparsons.workers.dev/geo';
  var geoPromise = fetch(GEO_URL, { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.json() : {}; })
    .catch(function(){ return {}; });

  // WHY a random id kept in this browser: lets the dashboard count unique
  // scanners (one phone scanning twice = one person) without storing
  // anything personal. WHY try/catch: private browsing can block storage;
  // the scan still logs, just without the id.
  function getVisitorId() {
    try {
      var k='iqqr_vid', v=localStorage.getItem(k);
      if (!v) { v = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)); localStorage.setItem(k, v); }
      return v;
    } catch (e) { return ''; }
  }

  // WHY the same parser as the dashboard's parseUA: saved at scan time so
  // stats don't depend on the raw browser string being complete.
  function parseUA(ua) {
    ua = ua || '';
    var os = /iPhone|iPad|iPod/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows'
           : /CrOS/.test(ua) ? 'ChromeOS' : /Mac OS X|Macintosh/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : 'Other';
    var br = /FBAN|FBAV/.test(ua) ? 'Facebook app' : /Instagram/.test(ua) ? 'Instagram app' : /SamsungBrowser/.test(ua) ? 'Samsung Internet'
           : /EdgiOS|EdgA|Edg\//.test(ua) ? 'Edge' : /FxiOS|Firefox\//.test(ua) ? 'Firefox' : /CriOS|Chrome\//.test(ua) ? 'Chrome'
           : /Safari\/|Version\//.test(ua) ? 'Safari' : (os==='iOS' ? 'Safari' : 'Other');
    return { os: os, browser: br };
  }

  // WHY only when the code's owner turned it on: it shows a permission
  // pop-up. WHY our own 10s cap: the browser's timeout doesn't count the
  // time the pop-up sits unanswered, so without it the redirect could hang.
  function getPreciseLocation() {
    return new Promise(function(resolve){
      if (!navigator.geolocation) return resolve(null);
      var done=false; function fin(v){ if (!done) { done=true; resolve(v); } }
      setTimeout(function(){ fin(null); }, 10000);
      navigator.geolocation.getCurrentPosition(
        function(pos){ fin({ lat: pos.coords.latitude, lon: pos.coords.longitude, acc: Math.round(pos.coords.accuracy) }); },
        function(){ fin(null); }, // WHY: "Don't Allow" or an error just means no precise point
        { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 }
      );
    });
  }

  // WHY keep any utm_ values already in the destination: the owner may have
  // set their own, and those should win.
  function addUtm(dest, slug) {
    try {
      var u = new URL(dest);
      if (!u.searchParams.has('utm_source'))   u.searchParams.set('utm_source', 'qr');
      if (!u.searchParams.has('utm_medium'))   u.searchParams.set('utm_medium', 'qr_code');
      if (!u.searchParams.has('utm_campaign')) u.searchParams.set('utm_campaign', slug);
      return u.href;
    } catch (e) { return dest; } // WHY: a destination URL can't parse → send them there untouched
  }

  var slug = new URLSearchParams(window.location.search).get('slug')
          || window.location.hash.replace('#','').trim();

  if (!slug) {
    showError('No QR code specified. <a href="/QRCode/">Go back</a>');
  } else {
    (async () => {
      try {
        var ref  = doc(db, 'qrcodes', slug);
        var snap = await getDoc(ref);

        if (!snap.exists()) {
          showError('QR code not found. <a href="/QRCode/">Create one</a>');
          return;
        }

        var data = snap.data();
        var dest = normalizeDest(data.redirectUrl);
        if (!dest) {
          showError('This code has no valid destination yet. <a href="/QRCode/">Home</a>');
          return;
        }

        // WHY: log scan with timestamp, device type, and basic metadata
        // so dashboard stats are accurate
        var isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        var device = parseUA(navigator.userAgent);
        var gps = null;
        if (data.askGps) { msg.textContent = 'Finding your location'; gps = await getPreciseLocation(); msg.textContent = 'Redirecting'; }
        // WHY a 600ms cap: if the location lookup is slow, the scan is
        // logged without it rather than holding the person up.
        var geo = await Promise.race([geoPromise, new Promise(function(r){ setTimeout(function(){ r({}); }, 600); })]);
        // WHY allSettled + a 1.2s cap: counting the scan must never stop
        // or delay the person scanning from reaching the destination.
        await Promise.race([new Promise(function(r){ setTimeout(r, 1200); }), Promise.allSettled([
          // Increment counter on the main doc
          updateDoc(ref, { scanCount: increment(1) }),
          // Add a scan log entry for per-day / per-device breakdown
          addDoc(collection(db,'qrcodes',slug,'scans'), {
            ts: Date.now(),
            mobile: isMobile,
            ua: navigator.userAgent.slice(0,300), // WHY 300 (was 120): 120 cut off the browser name on iPhones
            os: device.os,
            browser: device.browser,
            lang: String(navigator.language || '').slice(0,20),
            vid: getVisitorId(),
            gpsLat: gps ? gps.lat : null,
            gpsLon: gps ? gps.lon : null,
            gpsAcc: gps ? gps.acc : null,
            // WHY approximate only: this comes from the network address, so
            // it's city-level and carriers can be off by a town or two.
            city: String(geo.city || '').slice(0,60),
            region: String(geo.region || '').slice(0,60),
            country: String(geo.country || '').slice(0,4),
            lat: typeof geo.lat === 'number' ? geo.lat : null,
            lon: typeof geo.lon === 'number' ? geo.lon : null
          })
        ])]);

        // Redirect
        if (data.utm) dest = addUtm(dest, slug);
        window.location.replace(dest);

      } catch(e) {
        showError('Error: ' + e.message + ' · <a href="/QRCode/">Home</a>');
      }
    })();
  }
</script>
</body>
</html>
