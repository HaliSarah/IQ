    ratio:"60 breaths per minute. 10 to 20 breaths per round for intermediate; up to 120 for advanced. Always followed by full retention.",
    steps:["Sit upright, spine perfectly tall. Take a preparatory breath.","Begin forceful exhalation -- lower abdomen pumps in sharply.","Immediately follow with forceful inhalation -- lower abdomen expands out sharply.","Continue: forceful out, forceful in, same rhythm. Keep shoulders still.","After the round (10 to 20 breaths), take one very deep complete inhalation.","Retain with all three bandhas for as long as comfortable. Then exhale slowly.","Rest and absorb. Repeat 2 to 3 rounds maximum. Never more."],
    caution:"All Kapalabhati cautions apply PLUS avoid with Pitta imbalance, in hot weather, and never more than 3 rounds without rest between them. Do not practice at high altitude.",
    also:["Kapalabhati","Surya Bhedana","Anuloma Viloma"]
  }
};

var allKeys = Object.keys(results);
var current = 0;
var answers = {};
var scores = {};
allKeys.forEach(function(k){ scores[k] = 0; });

function render() {
  var body = document.getElementById('quiz-body');
  if (current >= questions.length) { renderResult(body); return; }
  var q = questions[current];
  var pct = Math.round((current / questions.length) * 100);
  var html = '<div class="progress-label">Question ' + (current+1) + ' of ' + questions.length + '</div>';
  html += '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
  html += '<div class="question-card">';
  html += '<div class="question-num">Question ' + (current+1) + '</div>';
  html += '<div class="question-text">' + q.q + '</div>';
  html += '<div class="options">';
  for (var i = 0; i < q.opts.length; i++) {
    var sel = answers[current] === i ? ' selected' : '';
    html += '<button class="option' + sel + '" onclick="selectOpt(' + i + ')">';
    html += '<span class="option-dot"></span><span>' + q.opts[i].text + '</span></button>';
  }
  html += '</div><div class="btn-row">';
  if (current > 0) html += '<button class="btn-back" onclick="goBack()">&larr; Back</button>';
  var disabled = answers[current] === undefined ? ' disabled' : '';
  var label = current === questions.length - 1 ? 'See my practice &rarr;' : 'Next &rarr;';
  html += '<button class="btn-next" id="btn-next" onclick="goNext()"' + disabled + '>' + label + '</button>';
  html += '</div></div>';
  body.innerHTML = html;
}

function selectOpt(i) {
  answers[current] = i;
  var opts = document.querySelectorAll('.option');
  for (var j = 0; j < opts.length; j++) {
    opts[j].classList.toggle('selected', j === i);
  }
  document.getElementById('btn-next').disabled = false;
}

function goNext() {
  var q = questions[current];
  var scr = q.opts[answers[current]].scores;
  for (var k in scr) { if (scores[k] !== undefined) scores[k] += scr[k]; }
  current++;
  render();
}

function goBack() {
  if (current > 0) { current--; render(); }
}

function getBest() {
  var best = allKeys[0]; var top = scores[allKeys[0]];
  for (var i = 1; i < allKeys.length; i++) {
    if (scores[allKeys[i]] > top) { top = scores[allKeys[i]]; best = allKeys[i]; }
  }
  return best;
}

function renderResult(body) {
  var best = getBest();
  var r = results[best];
  var html = '<div class="result-card">';
  html += '<div class="result-hero"><div class="label">Your practice is</div>';
  html += '<h2>' + r.name + '</h2>';
  html += '<div class="meaning">' + r.meaning + '</div></div>';
  html += '<div class="result-body">';
  html += '<div class="result-tags">' + r.tags.map(function(t){return '<span class="tag">'+t+'</span>';}).join('') + '</div>';
  html += '<div class="result-section"><h3>Why this practice</h3><p>' + r.why + '</p></div>';
  html += '<div class="result-section"><h3>What it is</h3><p>' + r.what + '</p></div>';
  html += '<div class="result-section"><h3>Classical ratio</h3><div class="ratio-box">' + r.ratio + '</div></div>';
  html += '<div class="result-section"><h3>Step-by-step practice</h3><ol class="steps">';
  r.steps.forEach(function(s){ html += '<li>' + s + '</li>'; });
  html += '</ol></div>';
  html += '<div class="result-section"><h3>Safety notes</h3><div class="caution-box">' + r.caution + '</div></div>';
  if (r.also && r.also.length) {
    html += '<div class="also-try"><h3>Also worth exploring</h3><div class="also-pills">';
    r.also.forEach(function(name){
      html += '<button class="pill" onclick="showOther(\'' + name + '\')">' + name + '</button>';
    });
    html += '</div></div>';
  }
  html += '<div class="print-row">';
  html += '<button class="btn-print" onclick="window.print()">Print / Save as PDF</button>';
  html += '<button class="btn-restart" onclick="restart()">Retake quiz</button>';
  html += '</div></div></div>';
  body.innerHTML = html;
}

function showOther(name) {
  var r = null; var key = null;
  for (var k in results) { if (results[k].name === name) { r = results[k]; key = k; break; } }
  if (!r) return;
  var body = document.getElementById('quiz-body');
  var html = '<div style="margin-bottom:1rem"><button class="btn-back" onclick="var b=getBest();renderResult(document.getElementById(\'quiz-body\'))">&larr; Back to my result</button></div>';
  html += '<div class="result-card">';
  html += '<div class="result-hero"><div class="label">Practice profile</div>';
  html += '<h2>' + r.name + '</h2>';
  html += '<div class="meaning">' + r.meaning + '</div></div>';
  html += '<div class="result-body">';
  html += '<div class="result-tags">' + r.tags.map(function(t){return '<span class="tag">'+t+'</span>';}).join('') + '</div>';
  html += '<div class="result-section"><h3>What it is</h3><p>' + r.what + '</p></div>';
  html += '<div class="result-section"><h3>Classical ratio</h3><div class="ratio-box">' + r.ratio + '</div></div>';
  html += '<div class="result-section"><h3>Step-by-step</h3><ol class="steps">';
  r.steps.forEach(function(s){ html += '<li>' + s + '</li>'; });
  html += '</ol></div>';
  html += '<div class="result-section"><h3>Safety notes</h3><div class="caution-box">' + r.caution + '</div></div>';
  html += '<div class="print-row"><button class="btn-print" onclick="window.print()">Print / Save as PDF</button></div>';
  html += '</div></div>';
  body.innerHTML = html;
}

function restart() {
  current = 0; answers = {};
  allKeys.forEach(function(k){ scores[k] = 0; });
  render();
}

render();
</script>
