var MUDRAS={
  gyan:{
    name:"Gyan Mudra",alt:"Mudra of Knowledge",
    tags:["Focus","Mental clarity","Root chakra","All levels"],
    why:"Your answers point to a mind that needs anchoring and clarity. Gyan Mudra is the most universal gesture of knowledge and consciousness &mdash; it connects the individual self (index finger) with universal awareness (thumb), creating a circuit that calms mental turbulence and sharpens focus.",
    what:"Gyan (also spelled Jnana) means &lsquo;knowledge&rsquo; in Sanskrit. This is the gesture you see most often in meditation statues &mdash; the index finger and thumb forming a circle while the other fingers extend softly. It balances the Vata dosha (air energy) and stimulates the root chakra, creating mental stability.",

    how:["Rest both hands on your knees, palms facing upward &mdash; receptive mode &mdash; or facing downward for grounding.",
         "Connect the tip of your index finger to the tip of your thumb, forming a soft circle.",
         "Allow the other three fingers to extend naturally, without strain.",
         "Hold for 15 to 45 minutes, with or without breath practice.",
         "Soften your gaze or close your eyes. Let the circuit draw scattered energy back toward center."],
    caution:"Safe for virtually everyone. Those with Kapha imbalance (heaviness, lethargy) may prefer palms down to energize.",
    also:["Chin Mudra","Hakini Mudra","Dhyana Mudra"]
  },
  chin:{
    name:"Chin Mudra",alt:"Mudra of Consciousness",
    tags:["Meditation","Consciousness","Spiritual depth","Calming"],
    why:"You are being drawn toward depth &mdash; toward the recognition of your own consciousness as something vast and still. Chin Mudra is Gyan Mudra's meditative twin. The gesture&rsquo;s meaning is encoded in the fingers: thumb = universal consciousness, index = individual self, the three folded fingers = maya, karma, and ego. The connection of thumb and index finger is the union of the human and the divine.",
    what:"Chin (pronounced &lsquo;cheen&rsquo;) means &lsquo;consciousness&rsquo; or &lsquo;awareness.&rsquo; Where Gyan Mudra uses palms up in receptivity, Chin Mudra places palms facing downward &mdash; directing consciousness inward and downward into the body. It is particularly powerful during pranayama and seated meditation.",
    element:"Air (Vayu)",chakra:"Third Eye (Ajna) & Crown (Sahasrara)",
    how:["Sit comfortably with spine erect. Rest the backs of your hands on your thighs.",
         "Touch the tip of your index finger to the tip of your thumb.",
         "Let the other three fingers extend naturally but remain soft.",
         "Palms face down toward the earth &mdash; this is the key difference from Gyan Mudra.",
         "Hold for the duration of your meditation. Notice how the gesture creates a sense of inner containment."],
    caution:"No significant contraindications. Can be practiced for extended periods.",
    also:["Gyan Mudra","Dhyana Mudra","Brahma Mudra"]
  },
  dhyana:{
    name:"Dhyana Mudra",alt:"Mudra of Meditation",
    tags:["Deep stillness","Meditation","Crown chakra","Evening"],
    why:"Your energy calls for the deepest stillness available to you right now. Dhyana Mudra is the gesture of the Buddha in meditation &mdash; the gesture that holds the universe in a bowl formed by two open palms. It says: I am receiving. I am empty. I am present.",
    what:"Dhyana means &lsquo;meditation&rsquo; or &lsquo;absorption&rsquo; in Sanskrit &mdash; the seventh of Patanjali&rsquo;s eight limbs. The gesture places the right hand in the left, palms facing upward, thumbs lightly touching &mdash; creating a triangle, symbol of the three jewels and spiritual fire. It is used in Vipassana, Zen, and Hindu meditation traditions worldwide.",
    element:"All five elements in balance",chakra:"Crown (Sahasrara) & Third Eye (Ajna)",
    how:["Sit in your preferred meditation posture, spine tall.",
         "Rest both hands in your lap, right hand resting on top of the left.",
         "Both palms face upward. The four fingers of each hand rest on the others.",
         "Allow the thumbs to touch lightly at their tips, forming a triangle.",
         "Close your eyes. Release all effort. This mudra holds you without you needing to hold anything.",
         "Hold for the duration of your sit &mdash; 10 minutes to 1 hour."],
    caution:"Virtually no contraindications. The most universally safe mudra.",
    also:["Chin Mudra","Gyan Mudra","Brahma Mudra"]
  },
  prana:{
    name:"Prana Mudra",alt:"Mudra of Life Force",
    tags:["Energy activation","Healing","Immune system","Fatigue"],
    why:"You are running low. The well needs refilling. Prana Mudra is one of the most immediately effective gestures for restoring depleted energy &mdash; it activates dormant prana throughout the body, stimulates the immune system, and is said to awaken the eyes and improve vision on both physical and inner levels.",
    what:"Prana is life force itself &mdash; the animating energy behind every breath and heartbeat. This mudra connects the ring finger (earth) and little finger (water) to the thumb (fire), combining the three elements that most directly sustain the body. It is sometimes called the mudra of health and is recommended whenever you feel physically or energetically drained.",
    element:"Earth, Water & Fire",chakra:"Root (Muladhara) & Sacral (Svadhisthana)",
    how:["Rest both hands on your thighs, palms upward.",
         "Bend the ring finger and little finger to touch the tip of the thumb.",
         "Keep the index and middle fingers extended naturally.",
         "Hold for 15 to 30 minutes. Can be practiced at any time including lying down.",
         "Breathe slowly and imagine golden light entering through your hands with each inhale."],

  },
  hridaya:{
    name:"Hridaya Mudra",alt:"Mudra of the Heart",
    tags:["Heart opening","Emotional release","Grief","Anxiety"],
    why:"Your heart needs attention. Hridaya Mudra diverts prana from the hands directly to the heart &mdash; a circuit described in classical texts as supporting the heart&rsquo;s physical and emotional function. Wherever grief, fear, or constriction lives, this mudra creates space.",
    what:"Hridaya means &lsquo;heart&rsquo; in Sanskrit. This mudra is described in the Hatha Yoga Pradipika as beneficial for the heart&rsquo;s physical functioning. It is used in yoga therapy for heart conditions and emotional healing. The index finger folds to touch the base of the thumb, while ring and middle fingers extend to touch the thumb tip &mdash; drawing energy from the periphery into the heart center.",

    how:["Sit comfortably, spine soft but upright.",
         "Fold the index finger inward to touch the base of the thumb.",
         "Bring the tips of the middle and ring fingers to touch the tip of the thumb.",
         "Keep the little finger extended and relaxed.",
         "Rest both hands on your knees, palms facing upward.",
         "Close your eyes and breathe slowly into the chest. Hold for 15 minutes."],
    caution:"Best practiced after eating has settled. Those with acute heart conditions should practice gently and briefly.",
    also:["Lotus Mudra","Anjali Mudra","Padma Mudra"]
  },
  lotus:{
    name:"Padma Mudra",alt:"Lotus Mudra / Mudra of the Flowering Heart",
    tags:["Heart chakra","Compassion","Opening","Transformation"],
    why:"You are ready to open. The lotus grows in muddy water and blooms untouched &mdash; this mudra carries that exact teaching. Whatever the difficulty you are moving through, Padma Mudra says: bloom anyway. It opens the heart center and invites compassion to flow both toward yourself and outward.",
    what:"Padma is Sanskrit for lotus &mdash; the sacred flower that rises from darkness into light without being stained by the mud. The mudra begins in Anjali (prayer position) and blossoms open, with only the base of the palms, thumbs, and little fingers remaining connected. The open flower form is the heart in its most generous state.",
    element:"Water & Air",chakra:"Heart (Anahata)",
    how:["Begin with hands pressed together in Anjali Mudra at the heart.",

         "Open the ring, middle, and index fingers wide, spreading them like lotus petals opening.",

    also:["Hridaya Mudra","Anjali Mudra","Padma Mudra"]
  },
  anjali:{
    name:"Anjali Mudra",alt:"Prayer Gesture / Namaste",
    tags:["Reverence","Connection","Greeting","Heart"],
    why:"Something in you is seeking reconnection &mdash; to yourself, to others, to something larger. Anjali Mudra is the oldest gesture of acknowledgment in the world. By pressing the right and left palm together, you unite the two hemispheres of the brain, the masculine and feminine, the individual and the universal. You are saying: the light in me recognizes the light in you.",
    what:"Anjali comes from Sanskrit meaning &lsquo;divine offering&rsquo; or a gesture of reverence. This is the Namaste mudra &mdash; used across India, Southeast Asia, and in yoga worldwide as greeting, prayer, and gratitude. At the heart, it represents unity. At the forehead (the highest position), it represents complete surrender to the divine.",

    how:["Press both palms together flat, fingers pointing upward.",

         "Can be used as a daily opening or closing gesture for any practice."],
    caution:"No contraindications. Safe and appropriate for all people in all contexts.",
    also:["Padma Mudra","Hridaya Mudra","Lotus Mudra"]
  },
  hakini:{
    name:"Hakini Mudra",alt:"Mudra of the Mind / Third Eye Gesture",

    why:"Your mind needs integration &mdash; left and right, analytical and intuitive, doing and being. Hakini Mudra is associated with Hakini, the deity of the Ajna (third eye) chakra, and is one of the most scientifically studied mudras: research suggests it activates the frontal lobe and supports memory recall, creativity, and communication between the brain&rsquo;s hemispheres.",
    what:"This mudra brings all five fingertips of both hands to meet their counterparts, creating a hollow sphere of interlaced fingers. The resulting form resembles the third eye &mdash; a space between two meeting points. It is used specifically when mental clarity, focused attention, or recall is needed, and is described in texts as stimulating the Ajna chakra.",

    how:["Hold both hands in front of your body at chest or face height.",
         "Bring all five fingertips of the right hand to meet all five of the left.",
         "Create a ball of space between the palms &mdash; fingers touching but palms not pressing.",
         "Optionally raise the mudra to the level of the third eye (between the eyebrows).",
         "Breathe steadily. Visualize a sphere of light between your hands. Hold for 10 to 20 minutes."],
    caution:"No contraindications. Excellent for use during study, creative work, or problem-solving.",
    also:["Gyan Mudra","Chin Mudra","Brahma Mudra"]
  },
  prithvi:{
    name:"Prithvi Mudra",alt:"Earth Mudra / Mudra of the Body",

var keys=Object.keys(MUDRAS);
var cur=0,answers={},scores={};
keys.forEach(function(k){scores[k]=0});

function render(){
  var b=document.getElementById('body');
  if(cur>=Q.length){showResult(b);return}
  var q=Q[cur],pct=Math.round(cur/Q.length*100);
  var h='<div class="prog-label">Question '+(cur+1)+' of '+Q.length+'</div>';
  h+='<div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div>';
  h+='<div class="q-card">';
  h+='<div class="q-num">Question '+(cur+1)+'</div>';
  h+='<div class="q-text">'+q.q+'</div>';
  h+='<div class="opts">';
  for(var i=0;i<q.opts.length;i++){
    var s=answers[cur]===i?' sel':'';
    h+='<button class="opt'+s+'" onclick="pick('+i+')"><span class="dot"></span><span>'+q.opts[i].t+'</span></button>';
  }
  h+='</div><div class="btn-row">';
  if(cur>0)h+='<button class="btn-back" onclick="back()">&larr; Back</button>';
  var dis=answers[cur]===undefined?' disabled':'';
  var lbl=cur===Q.length-1?'Find my mudra &rarr;':'Next &rarr;';
  h+='<button class="btn-next" id="nxt" onclick="next()"'+dis+'>'+lbl+'</button>';
  h+='</div></div>';
  b.innerHTML=h;
}

function pick(i){
  answers[cur]=i;
  document.querySelectorAll('.opt').forEach(function(o,j){o.classList.toggle('sel',j===i)});
  document.getElementById('nxt').disabled=false;
}

function next(){
  var sc=Q[cur].opts[answers[cur]].s;
  for(var k in sc){if(scores[k]!==undefined)scores[k]+=sc[k]}
  cur++;render();
}

function back(){if(cur>0){cur--;render();}}

function getBest(){
  var best=keys[0],top=scores[keys[0]];
  for(var i=1;i<keys.length;i++){if(scores[keys[i]]>top){top=scores[keys[i]];best=keys[i]}}
  return best;
}

function showResult(b){
  var key=getBest(),m=MUDRAS[key];
  var h='<div class="res-card">';
  h+='<div class="res-hero"><div class="badge">Your mudra for this moment</div>';
  h+='<h2>'+m.name+'</h2><div class="meaning">'+m.alt+'</div></div>';
  h+='<div class="res-body">';
  h+='<div class="tags">'+m.tags.map(function(t){return'<span class="tag">'+t+'</span>'}).join('')+'</div>';
  h+='<div class="rs"><h3>Why this mudra</h3><p>'+m.why+'</p></div>';
  h+='<div class="rs"><h3>What it is</h3><p>'+m.what+'</p>';
  h+='<p style="margin-top:.5rem;font-size:.88rem;color:var(--gray)"><strong>Element:</strong> '+m.element+' &nbsp;&bull;&nbsp; <strong>Chakra:</strong> '+m.chakra+'</p></div>';
  h+='<div class="rs"><h3>How to hold it</h3><div class="how-box"><ol>';
  m.how.forEach(function(s){h+='<li>'+s+'</li>'});
  h+='</ol></div></div>';
  h+='<div class="rs"><h3>A note</h3><div class="caution">'+m.caution+'</div></div>';
  h+='<div class="also"><h3>Also explore</h3><div class="pills">';
  m.also.forEach(function(n){h+='<button class="pill" onclick="showMudra(\''+n+'\')">'+n+'</button>'});
  h+='</div></div>';
  h+='<div class="prow"><button class="btn-print" onclick="window.print()">Print / Save as PDF</button>';
  h+='<button class="btn-restart" onclick="restart()">Retake quiz</button></div>';
  h+='</div></div>';
  b.innerHTML=h;
}

function showMudra(name){
  var m=null,key=null;
  for(var k in MUDRAS){if(MUDRAS[k].name===name||MUDRAS[k].alt.indexOf(name)>-1){m=MUDRAS[k];key=k;break}}
  if(!m)return;
  var b=document.getElementById('body');
  var h='<div style="margin-bottom:1rem"><button class="btn-back" onclick="var bk=getBest();showResult(document.getElementById(\'body\'))">&larr; Back to my result</button></div>';
  h+='<div class="res-card"><div class="res-hero"><div class="badge">Mudra profile</div>';
  h+='<h2>'+m.name+'</h2><div class="meaning">'+m.alt+'</div></div>';
  h+='<div class="res-body">';
  h+='<div class="tags">'+m.tags.map(function(t){return'<span class="tag">'+t+'</span>'}).join('')+'</div>';
  h+='<div class="rs"><h3>What it is</h3><p>'+m.what+'</p>';
  h+='<p style="margin-top:.5rem;font-size:.88rem;color:var(--gray)"><strong>Element:</strong> '+m.element+' &nbsp;&bull;&nbsp; <strong>Chakra:</strong> '+m.chakra+'</p></div>';
  h+='<div class="rs"><h3>How to hold it</h3><div class="how-box"><ol>';
  m.how.forEach(function(s){h+='<li>'+s+'</li>'});
  h+='</ol></div></div>';
  h+='<div class="rs"><h3>A note</h3><div class="caution">'+m.caution+'</div></div>';
  h+='<div class="prow"><button class="btn-print" onclick="window.print()">Print / Save as PDF</button></div>';
  h+='</div></div>';
  b.innerHTML=h;
}

function restart(){cur=0;answers={};keys.forEach(function(k){scores[k]=0});render();}
render();
</script>
