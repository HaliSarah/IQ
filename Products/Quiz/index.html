      { n:'Demystifying Holographic Windowsill Plate', c:'Charging Plates', u:'Charging-Plates/Demystifying-Holographic-Windowsill', price:180, in:['intuit','heal'], use:['charge','space'], col:['purple'], why:'Holographic Metatron plate with amethyst and moonstone for your windowsill.' },

      { n:'Pocket Gems', c:'Crystals', u:'Crystals/Pocket-Gems', price:null, in:['heal','love','intuit'], use:['carry'], col:['green','yellow','orange','pink','blue','purple','red'], why:'Tiny copper-wrapped quartz gems in every color — pick the energy you need.' },

      { n:'Pink Diamonds Earrings', c:'Earrings', u:'Earrings/Pink-Diamonds', price:9.99, in:['abund','love'], use:['wear'], col:['pink'], sp:'phone', why:'Diamond shapes for wealth, contentment and trusting your abundance.' },
      { n:'Pink Gem Hearts Earrings', c:'Earrings', u:'Earrings/Pink-Gem-Hearts', price:9.99, in:['love','heal'], use:['wear'], col:['pink'], sp:'phone', why:'Faceted hearts that raise your loving vibration.' },
      { n:'Pink Pizza Slices Earrings', c:'Earrings', u:'Earrings/Pink-Pizza-Slices', price:9.99, in:['abund','love'], use:['wear'], col:['pink'], sp:'phone', why:'Playful slices for self-worth and stronger connections.' },
      { n:'Pink Promises Earrings', c:'Earrings', u:'Earrings/Pink-Promises', price:9.99, in:['abund'], use:['wear'], col:['pink'], sp:'phone', why:'Mismatched oval and square that strengthen trust in yourself.' },
      { n:'Slender Celadons Earrings', c:'Earrings', u:'Earrings/Slender-Celadons', price:9.99, in:['calm','heal'], use:['wear'], col:['green'], sp:'phone', why:'Tear shapes in celadon for serenity, renewal and forgiveness.' },
      { n:'Teal Triangles Earrings', c:'Earrings', u:'Earrings/Teal-Triangles', price:9.99, in:['calm','abund'], use:['wear'], col:['aqua'], sp:'phone', why:'Teal triangles for serenity with a boost of courage.' },

      // Games, hands, keychains
      { n:'Eye-Contact Trust Dominos', c:'Games', u:'Games/Eye-Contact-Trust-Dominos', price:null, in:['create','love'], use:['play'], col:['orange'], why:'A 28-piece orgonite domino set that turns game night into fun, trusting energy.' },
      { n:'Creative Hand', c:'Hands', u:'Hands/Creative-Hand', price:75, in:['create'], use:['space'], col:[], why:'Copper spirals, a key and an open chain to unlock your creative freedom.' },
      { n:'Healing Hand', c:'Hands', u:'Hands/Healing-Hand', price:65, in:['heal','love'], use:['space'], col:['green','pink'], why:'Malachite and rose quartz flowing through five copper-wrapped fingertips.' },
      { n:'Basic Keychains', c:'Keychains', u:'Keychains/Basic-Keychains', price:15, in:['heal','abund'], use:['car','carry'], col:['yellow'], why:'Happy yellow orgonite that softens car EMF on every drive.' },
      { n:'Purity Keychain', c:'Keychains', u:'Keychains/Purity-Keychain', price:20, in:['intuit','clarity'], use:['car','carry'], col:['aqua'], why:'Aquamarine, spiral and lotus for purity and spiritual awakening on the go.' },

      // Necklaces
      { n:'Clear Empowering Pi Shift', c:'Necklaces', u:'Necklaces/Clear-Empowering-Pi-Shift', price:19.99, in:['abund','heal'], use:['wear'], col:['clear'], why:'Tiger\'s eye and black tourmaline for self-confidence and releasing fear.' },
      { n:'Misty Inner Traveler', c:'Necklaces', u:'Necklaces/Misty-Inner-Traveler', price:14.99, in:['heal','intuit'], use:['wear'], col:['green'], why:'Tourmaline for protection and aventurine to dissolve negative thoughts.' },
      { n:'Mossy Droplet', c:'Necklaces', u:'Necklaces/Mossy-Droplet', price:14.99, in:['heal','clarity'], use:['wear'], col:['green'], why:'Moss agate soul refresher that encourages growth.' },
      { n:'Mossy Puzzle Piece', c:'Necklaces', u:'Necklaces/Mossy-Puzzle-Piece', price:14.99, in:['abund'], use:['wear'], col:['green'], why:'A puzzle piece with moss agate to attract abundance and complete your soul\'s puzzle.' },
      { n:'Passionate Creativity Chamber', c:'Necklaces', u:'Necklaces/Passionate-Creativity-Chamber', price:19.99, in:['create'], use:['wear'], col:['red','orange'], why:'Spiral, heart and broken chain for inspiration, passion and freedom to express.' },
      { n:'Paw Spirit Connection', c:'Necklaces', u:'Necklaces/Paw-Spirit-Connection', price:14.99, in:['intuit','love'], use:['wear'], col:[], sp:'pet', why:'Connects you with the spirit of a pet — living or crossed over.' },
      { n:'Pure Periwinkle Pair', c:'Necklaces', u:'Necklaces/Pure-Periwinkle-Pair', price:14.99, in:['calm','love','clarity'], use:['wear'], col:['purple','blue'], why:'Two periwinkle shells with 24k gold for cleansing ocean energy and unity.' },
      { n:'Purity Puzzle Piece', c:'Necklaces', u:'Necklaces/Purity-Puzzle-Piece', price:14.99, in:['clarity'], use:['wear'], col:['clear'], why:'A clean, simple quartz puzzle piece for pure, clear energy.' },
      { n:'Strawberry Peach Copper Droplet', c:'Necklaces', u:'Necklaces/Strawberry-Peach-Copper-Droplet', price:19.99, in:['abund','heal'], use:['wear'], col:['orange','pink'], why:'Gold-plated nails for stability on a healing copper chain.' },
      { n:'Strawberry Peach Half-Heart (Large)', c:'Necklaces', u:'Necklaces/Strawberry-Peach-Half-Heart-Large', price:14.99, in:['love'], use:['wear'], col:['pink','orange'], why:'A half-heart with brass spirals — perfect to share love with someone.' },
      { n:'Strawberry Peach Rectangle Half-Heart', c:'Necklaces', u:'Necklaces/Strawberry-Peach-Rectangle-Half-Heart', price:14.99, in:['love'], use:['wear'], col:['pink','orange'], why:'A modern rectangle half-heart that amplifies loving energy.' },

      // Pyramids & skull — home, altar and meditation pieces
      { n:'Celestial Oceanic Bubble Pyramid', c:'Pyramids', u:'Pyramids/Celestial-Oceanic-Bubble-Pyramid', price:45, in:['intuit'], use:['space'], col:['blue'], why:'Angelite, lapis and celestite to develop psychic abilities and hear your guides.' },
      { n:'Dream Recall Pyramid', c:'Pyramids', u:'Pyramids/Dream-Recall-Pyramid', price:65, in:['dream','intuit'], use:['space'], col:['green'], why:'Flower of life and aventurine to influence and remember your dreams.' },
      { n:'Intuitive Third-Eye Pyramid', c:'Pyramids', u:'Pyramids/Intuitive-Third-Eye-Pyramid', price:25, in:['intuit','calm'], use:['space','carry'], col:['aqua'], why:'A tiny turquoise pyramid for soul expression and regaining balance.' },
      { n:'The Celestial Skull', c:'Skulls', u:'Skulls/The-Celestial-Skull', price:null, in:['calm','intuit','love'], use:['space'], col:['blue'], why:'Lapis-eyed skull with 24k gold for meditation and your altar.' },
    ];

    /* Questions. Each option's value feeds the scoring in score(). */
    const Q = [
      { k:'in', q:'What do you want more of right now?', o:[
        ['love','Love','Romance, self-love, family'], ['calm','Peace & calm','Less stress, more stillness'],
        ['create','Creativity','Motivation & inspiration'], ['heal','Healing & protection','Shielding & renewal'],
        ['intuit','Intuition','Spirit, psychic & divine connection'], ['abund','Abundance & confidence','Goals, worth, courage'],
        ['clarity','Clarity','A clear, focused mind'], ['dream','Dreams','Remember & guide your dreams'] ] },
      { k:'use', q:'How do you want to use it?', o:[
        ['wear','Wear it','Necklace or earrings'], ['carry','Carry it','Pocket or purse'],
        ['car','In my car','Keys & commute'], ['space','Display it','Home, desk or altar'],
        ['charge','Charge things','Crystals, food, plants'],
        ['play','Play with others','Game night'] ] },
      { k:'budget', q:'What\'s your budget?', o:[
        [20,'Under $20',''], [50,'Up to $50',''], [120,'Up to $120',''], [Infinity,'Treat myself','No limit'] ] },
      { k:'sp', q:'Does any of these fit you?', o:[
        ['phone','I\'m on my phone or earbuds a lot',''], ['pet','I want to connect with a pet',''],
        ['baby','Pregnancy or motherhood',''], ['none','None of these',''] ] },
      { k:'col', q:'Which color are you drawn to?', o:[
        ['pink','Pink',''], ['purple','Purple',''], ['blue','Blue',''], ['aqua','Aqua / Teal',''],
        ['green','Green',''], ['orange','Orange / Red',''], ['yellow','Yellow / Gold',''], ['clear','Clear / White',''] ] }
    ];

    const app = document.getElementById('app');
    const bar = document.getElementById('bar');
    let step = 0, ans = {};

    // Escapes text before it goes into innerHTML so product copy can't break the markup
    const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const money = p => p == null ? 'See price' : '$' + (Number.isInteger(p) ? p : p.toFixed(2));
    // Full URL so the link always lands on the product's own page, no matter how the quiz URL was typed
    const href = p => 'https://iqproductionz.com/Products/' + p.u + '/';

    function ask() {
      const q = Q[step];
      bar.style.width = (step / Q.length * 100) + '%';
      app.innerHTML =
        `<p class="step">Question ${step + 1} of ${Q.length}</p><h2>${esc(q.q)}</h2>
         <div class="options">${q.o.map((o, i) =>
           `<button data-i="${i}">${esc(o[1])}${o[2] ? `<small>${esc(o[2])}</small>` : ''}</button>`).join('')}</div>
         ${step ? '<button class="back">← Back</button>' : ''}`;
      // Re-trigger the fade so each question gets its breathing-room transition
      app.style.animation = 'none'; void app.offsetWidth; app.style.animation = '';
      app.querySelectorAll('.options button').forEach(b => b.onclick = () => {
        ans[q.k] = q.o[b.dataset.i][0];
        step++;
        step < Q.length ? ask() : result();
      });
      const back = app.querySelector('.back');
      if (back) back.onclick = () => { step--; ask(); };
    }

    /*
      Weighted scoring instead of strict filtering, so a shopper always gets a
      recommendation even when no product matches every answer exactly.
      Intention matters most, then how it's used, then special needs, then color.
    */
    function score(p) {
      let s = 0;
      const i = p.in.indexOf(ans.in);
      if (i === 0) s += 6; else if (i > 0) s += 4;
      if (p.use.includes(ans.use)) s += 5;
      if (ans.sp !== 'none' && p.sp === ans.sp) s += 7;
      // Phone users benefit from anything worn near the head, not just earrings
      if (ans.sp === 'phone' && p.use.includes('wear')) s += 1;
      if (p.col.includes(ans.col)) s += 2;
      // Over-budget items stay possible but sink, so a near-miss still beats nothing
      if (p.price != null && p.price > ans.budget) s -= 8;
      return s;
    }

    function result() {
      bar.style.width = '100%';
      // Shuffle first so ties don't always favor items listed earlier in the catalog
      const ranked = P.map(p => ({ p, s: score(p) + Math.random() * 0.5 }))
                      .sort((a, b) => b.s - a.s);
      const seen = new Set(), picks = [];
      // Set guards against a product being listed twice if the catalog ever repeats one
      for (const r of ranked) {
        if (seen.has(r.p.u)) continue;
        seen.add(r.p.u); picks.push(r.p);
        if (picks.length === 3) break;
      }
      const [top, ...rest] = picks;
      app.innerHTML =
        `<p class="step">Your matches</p>
         <div class="runners">${rest.map(p =>
           `<div class="mini"><h3>${esc(p.n)}</h3><p>${esc(p.c)} · <span class="price">${money(p.price)}</span></p>
            <a class="link" href="${href(p)}">View →</a></div>`).join('')}</div>
         <div class="top">
           <div class="label">Your best match</div>
           <h3>${esc(top.n)}</h3>
           <div class="cat">${esc(top.c)} · <span class="price">${money(top.price)}</span></div>
           <p class="why">${esc(top.why)}</p>
           <a class="btn" href="${href(top)}">See this product</a>
         </div>
         <button class="again">Retake the quiz</button>`;
      app.style.animation = 'none'; void app.offsetWidth; app.style.animation = '';
      app.querySelector('.again').onclick = () => { step = 0; ans = {}; ask(); };
    }

    ask();
  </script>
</body>
