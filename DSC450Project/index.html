<!DOCTYPE html>
<!--
  Title:       Spotify OAuth Callback
  Author:      Hali Sarah Parsons
  Date:        2026-09-22
  Modified By:
  Description: Captures the Spotify auth code from the redirect URL and
               displays it so the user can copy it into the terminal script.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotify Auth Code</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .status {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #1DB954;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }

    .code-box {
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 0.78rem;
      color: #1DB954;
      word-break: break-all;
      text-align: left;
      margin-bottom: 1.25rem;
      line-height: 1.6;
    }

    button {
      background: #1DB954;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #17a349; }

    .error {
      color: #e05555;
    }

    .error .status { color: #e05555; }
    .error .code-box { color: #e05555; border-color: #3a1a1a; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="status" id="status">Authenticating...</div>
    <h1 id="heading">Getting your code</h1>
    <p id="message">One moment...</p>
    <div class="code-box" id="code-display" style="display:none;"></div>
    <button id="copy-btn" style="display:none;" onclick="copyCode()">Copy Code</button>
  </div>

  <script>
    // Parse the auth code out of the URL query string on page load
    const params  = new URLSearchParams(window.location.search);
    const code    = params.get("code");
    const error   = params.get("error");

    const card      = document.getElementById("card");
    const status    = document.getElementById("status");
    const heading   = document.getElementById("heading");
    const message   = document.getElementById("message");
    const codeBox   = document.getElementById("code-display");
    const copyBtn   = document.getElementById("copy-btn");

    if (code) {
      // Success — display the code for the user to copy into terminal
      status.textContent       = "Authorization successful";
      heading.textContent      = "Copy this code into your terminal";
      message.textContent      = "Paste the code below when the script asks for it. Do not share this code with anyone.";
      codeBox.textContent      = code;
      codeBox.style.display    = "block";
      copyBtn.style.display    = "inline-block";
    } else if (error) {
      card.classList.add("error");
      status.textContent  = "Authorization failed";
      heading.textContent = "Something went wrong";
      message.textContent = `Spotify returned an error: "${error}". Close this tab and try running the script again.`;
      codeBox.textContent    = error;
      codeBox.style.display  = "block";
    } else {
      status.textContent  = "No code found";
      heading.textContent = "Nothing to show";
      message.textContent = "This page is the Spotify OAuth callback. Run the Python script to start the auth flow.";
    }

    function copyCode() {
      // Copy the auth code to clipboard so user can paste into terminal
      navigator.clipboard.writeText(code).then(() => {
        copyBtn.textContent = "Copied!";
        setTimeout(() => copyBtn.textContent = "Copy Code", 2000);
      });
    }
  </script>
</body>
</html>
